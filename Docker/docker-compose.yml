services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # Keeps the clone (including db.sqlite3) and installed packages across restarts
      - app_code:/app
      - app_venv:/opt/venv
      # Your gitignored keys file, kept on the server next to this compose file:
      #   ./secrets/api_keys.txt  ->  linked to scripts/api_keys.txt inside the repo
      - ./secrets/api_keys.txt:/run/secrets/api_keys.txt:ro
    # No "ports:" here on purpose: only Caddy is reachable from outside.
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Read-only view of the app so Caddy can serve the CSS/JS files directly
      - app_code:/srv/app:ro
    depends_on:
      - app

    cloudflared:
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        command: tunnel --no-autoupdate run
        environment:
          - TUNNEL_TOKEN=${TUNNEL_TOKEN}
        depends_on:
          - caddy

volumes:
  app_code:
  app_venv:


