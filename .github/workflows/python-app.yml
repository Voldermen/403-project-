# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
  
  

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      working-directory: skeleton
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated tests
      working-directory: skeleton
      run: |
        python - <<'PY'
        import unittest
        from app import app

        class TestApp(unittest.TestCase):


          def setUp(self):
            app.config["TESTING"] = True
            self.client = app.test_client()

          def test_home(self):
            response = self.client.get("/")

            self.assertEqual(response.status_code, 200)
            self.assertEqual(response.json["service"], "Unit Converter")

          def test_celsius_to_fahrenheit(self):
            response = self.client.get("/temp?value=100&from=C&to=F")

            self.assertEqual(response.status_code, 200)
            self.assertEqual(response.json["result"], 212)


          def test_invalid_value(self):
            response = self.client.get("/temp?value=hello&from=C&to=F")

            self.assertEqual(response.status_code, 400)
            self.assertEqual(response.json["error"],"value must be a number")
          
        unittest.main()
        PY
            
      
